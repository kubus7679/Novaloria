<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="rounded">
      <rect width="1024" height="1024" rx="190"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18394f"/>
      <stop offset="1" stop-color="#568b91"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#347f88"/>
      <stop offset="1" stop-color="#183f56"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#rounded)" stroke="#193748" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bold, simple setting: sunrise, coast and open sea -->
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="750" cy="330" r="144" fill="#f3c77d"/>
    <path d="M0 536Q180 488 352 532T699 523Q865 493 1024 527V1024H0Z" fill="url(#water)" stroke-width="16"/>
    <path d="M620 534Q684 472 765 463Q855 454 912 493Q961 521 1024 489V690H615Z" fill="#6e925b" stroke="none"/>
    <path d="M620 534Q684 472 765 463Q855 454 912 493Q961 521 1024 489" fill="none" stroke-width="16"/>
    <path d="M691 508 733 459 771 505M839 488 875 448 910 488" fill="none" stroke="#315d4c" stroke-width="18"/>

    <!-- A single, strong ship silhouette with broad, readable sails -->
    <path d="M256 673Q472 708 835 646L766 786Q709 849 435 852Q319 823 256 673Z" fill="#a9573e" stroke-width="22"/>
    <path d="M276 684Q500 714 815 656L783 718Q529 766 310 724Z" fill="#d09258" stroke-width="12"/>
    <path d="M289 669 407 650 535 662 665 634 801 650 774 688Q525 726 284 692Z" fill="#e5c58f" stroke-width="16"/>

    <!-- Two masts and three large sails; intentionally no fine rigging -->
    <path d="M451 228V663M658 347V649" fill="none" stroke-width="27"/>
    <path d="M438 278 286 563 440 544Z" fill="#f6e4bc" stroke-width="17"/>
    <path d="M467 290 608 555 469 535Z" fill="#e8cf9d" stroke-width="17"/>
    <path d="M641 391 532 601 644 583Z" fill="#f6e4bc" stroke-width="16"/>
    <path d="M451 225V175" fill="none" stroke-width="10"/>
    <path d="M456 179 525 195 456 214Z" fill="#c95647" stroke-width="9"/>

    <!-- A few broad wave marks keep the sea legible at small sizes -->
    <path d="M67 781Q148 750 226 781M804 884Q882 852 957 882" fill="none" stroke="#a8d0c2" stroke-width="18" opacity=".85"/>
    <path d="M88 856Q136 837 184 855" fill="none" stroke="#a8d0c2" stroke-width="12" opacity=".58"/>
  </g>
</svg>
