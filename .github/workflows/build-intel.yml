name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Intel macOS build and tests
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode 16.4 toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Verify Intel runner
        run: test "$(uname -m)" = "x86_64"

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: bash Tools/build-app.sh

      - name: Create DMG
        run: |
          bin_dir="$(swift build --show-bin-path)"
          lipo -verify_arch x86_64 "$bin_dir/Novaloria.app/Contents/MacOS/Novaloria"
          mkdir -p dist/dmg-root
          ditto \
            "$bin_dir/Novaloria.app" \
            dist/dmg-root/Novaloria.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Novaloria" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/Novaloria-macOS-x86_64.dmg

      - name: Upload app package
        uses: actions/upload-artifact@v6
        with:
          name: Novaloria-macOS-x86_64
          path: dist/Novaloria-macOS-x86_64.dmg
          if-no-files-found: error
          retention-days: 14
