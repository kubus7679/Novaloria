name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: macOS build and tests
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: bash Tools/build-app.sh

      - name: Create DMG
        run: |
          bin_dir="$(swift build --show-bin-path)"
          mkdir -p dist/dmg-root
          ditto \
            "$bin_dir/Novaloria.app" \
            dist/dmg-root/Novaloria.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "Novaloria" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/Novaloria-macOS.dmg

      - name: Upload app package
        uses: actions/upload-artifact@v6
        with:
          name: Novaloria-macOS
          path: dist/Novaloria-macOS.dmg
          if-no-files-found: error
          retention-days: 14
